kind = "web"
previewPath = "/"
title = "CodeQuest"
version = "1.0.0"
id = "artifacts/codequest"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 18505
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/codequest run dev"

[services.env]
PORT = "18505"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/codequest", "run", "build"]
publicDir = "artifacts/codequest/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
