packages:
  "framer-motion": "For smooth UI transitions, glassmorphic interactions, and gamification celebration modals"
  "canvas-confetti": "For celebratory confetti effects on level ups and badge unlocks"
  "@types/canvas-confetti": "TypeScript definitions for canvas-confetti"
  "@monaco-editor/react": "Code editor component for the problem-solving interface"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility function to efficiently merge Tailwind CSS classes in JS"
  "date-fns": "For formatting dates in submission history and daily quest"
  "zustand": "For simple and robust global state management for toasts and gamification overlays"
  "lucide-react": "Beautiful, consistent icons for gamification UI elements"

images:
