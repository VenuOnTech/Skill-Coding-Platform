    description: "Dark, sleek, futuristic competitive programming background with abstract glowing geometric shapes and code-like structures in deep vibrant indigo and purple"
    aspect_ratio: "16:9"
  - path: "artifacts/codequest/public/images/logo.png"
    description: "Minimalist glowing geometric logo for a competitive programming platform, dark background"
    aspect_ratio: "1:1"
